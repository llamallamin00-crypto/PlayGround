<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stormfront Battle</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8dcfff;font-family:Arial,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:2px 2px 2px #000}#bars{position:absolute;left:28px;bottom:78px;width:280px}.bar{height:19px;background:#111b;border:2px solid #fff8;margin:5px 0;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;width:100%;transition:.15s}.hp i{background:linear-gradient(90,#48d96d,#87ef9b)}.shield i{background:linear-gradient(90,#4ba7ff,#84d6ff)}#ammo{position:absolute;right:32px;bottom:72px;text-align:right}.big{font-size:48px;font-weight:900}.weapon{font-size:16px;color:#ffd86b;font-weight:bold}#healthNum{position:absolute;left:20px;bottom:61px;font-size:13px;font-weight:bold}#minimap{position:absolute;right:24px;top:24px;width:170px;height:170px;border:3px solid #fff;border-radius:50%;background:#74a85bdd;overflow:hidden}#minimap canvas{width:100%;height:100%}#alive{position:absolute;left:28px;top:25px;font-size:22px;font-weight:900}#kills{position:absolute;left:28px;top:54px;font-size:15px}#storm{position:absolute;left:50%;top:25px;transform:translateX(-50%);font-size:17px;font-weight:900;color:#aebcff}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px}.crossh,.crossv{position:absolute;background:white;box-shadow:0 0 2px #000}.crossh{width:18px;height:2px;top:8px}.crossv{width:2px;height:18px;left:8px}#notice{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;text-align:center;opacity:0;transition:.25s}#inventory{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.slot{width:65px;height:44px;border:2px solid #fff8;border-radius:5px;background:#182335cc;text-align:center;padding-top:5px;font-size:11px}.slot.active{border-color:#ffe45c;background:#d59d30cc}.slot b{display:block;font-size:16px}#start,#over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#061329bb;pointer-events:auto;text-align:center}.panel{background:linear-gradient(145deg,#18375ddf,#0b1028ed);border:2px solid #87aaff;padding:30px 46px;border-radius:12px;box-shadow:0 15px 50px #000}.panel h1{margin:0 0 8px;font-size:50px;text-shadow:0 3px #5a8cff}.panel p{color:#d9e5ff}.panel button{pointer-events:auto;border:0;border-radius:6px;padding:13px 34px;font-size:19px;font-weight:bold;background:#ffd84a;color:#191919;cursor:pointer}.hidden{display:none!important}.damage{position:absolute;inset:0;border:12px solid #f33;opacity:0;transition:.12s}.touch{display:none;position:absolute;pointer-events:auto}.touch button{border:2px solid #fff8;border-radius:50%;width:65px;height:65px;background:#1a2b52aa;color:white;font-size:24px}#stick{left:20px;bottom:32px;width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff5}#stickDot{position:absolute;width:58px;height:58px;border-radius:50%;background:#fff5;left:36px;top:36px}#touchFire{right:22px;bottom:38px;width:78px;height:78px;border-radius:50%;background:#ee4e42bb;border:2px solid #fff8;color:white;font-weight:bold}
@media(pointer:coarse){.touch{display:block}#ammo{bottom:125px}#inventory{bottom:8px}.slot{width:50px;height:38px}.slot:nth-child(3){display:none}}
</style>
</head>
<body>
<div id="game"></div><div class="hud"><div id="alive">ALIVE  <span id="aliveNum">20</span></div><div id="kills">ELIMINACIONES <span id="killsNum">0</span></div><div id="storm">ZONA 0:45</div><div id="bars"><div class="bar shield"><i id="shieldBar"></i></div><div class="bar hp"><i id="hpBar"></i></div></div><div id="healthNum">100 / 100</div><div id="minimap"><canvas id="map" width="170" height="170"></canvas></div><div id="cross"><i class="crossh"></i><i class="crossv"></i></div><div id="ammo"><div class="big"><span id="mag">30</span><span style="font-size:19px;color:#aaa"> / <span id="reserve">150</span></span></div><div class="weapon" id="weaponName">RIFLE DE ASALTO</div></div><div id="notice"></div><div id="inventory"><div class="slot active"><b>1</b>Rifle</div><div class="slot"><b>2</b>Escopeta</div><div class="slot"><b>3</b>Pistola</div><div class="slot"><b>4</b>Curar</div></div><div class="damage" id="damage"></div><div id="stick" class="touch"><div id="stickDot"></div></div><button id="touchFire" class="touch">FUEGO</button></div>
<div id="start"><div class="panel"><h1>STORMFRONT</h1><p>Mueve el personaje, dispara y sobrevive a la tormenta.<br><b>WASD</b> mover · <b>Ratón</b> apuntar · <b>Clic</b> disparar · <b>R</b> recargar</p><button id="play">JUGAR AHORA</button></div></div><div id="over" class="hidden"><div class="panel"><h1 id="overTitle">VICTORIA</h1><p id="overText"></p><button id="again">JUGAR DE NUEVO</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x87c9ee);scene.fog=new THREE.Fog(0x87c9ee,60,155);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x5a7341,2));const sun=new THREE.DirectionalLight(0xfff1c9,2.8);sun.position.set(-40,70,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(90,64),new THREE.MeshStandardMaterial({color:0x6c9d4f,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,z,w,d,h,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r=68+Math.random()*15;box(Math.cos(a)*r,Math.sin(a)*r,1.2,1.2,9,0x356439)}
for(let i=0;i<32;i++){const x=(Math.random()-.5)*145,z=(Math.random()-.5)*145;if(Math.abs(x)<8&&Math.abs(z)<8)continue;box(x,z,2+Math.random()*3,2+Math.random()*3,Math.random()*3+2,[0x2c7a59,0x777777,0xa87745][i%3])}
// landmark buildings
box(-28,-24,16,12,7,0xb0b1aa);box(30,19,13,15,9,0x9dabb2);box(-20,28,10,10,6,0x8b6851);
const player={pos:new THREE.Vector3(0,0,0),health:100,shield:50,angle:0,mag:30,reserve:150,reload:0,weapon:0,kills:0};
function makeChar(enemy=false){const g=new THREE.Group();const cloth=enemy?0x6245a4:0x376dbe;const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.55),new THREE.MeshStandardMaterial({color:cloth}));body.position.y=1.25;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,8),new THREE.MeshStandardMaterial({color:enemy?0xb98b73:0xe1b58d}));head.position.y=2.15;head.castShadow=true;g.add(head);for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.28,.85,.32),new THREE.MeshStandardMaterial({color:enemy?0x20202d:0x20345c}));leg.position.set(s*.22,.42,0);leg.castShadow=true;g.add(leg)}const arm=new THREE.Mesh(new THREE.BoxGeometry(.28,.85,.28),new THREE.MeshStandardMaterial({color:cloth}));arm.position.set(.55,1.35,-.05);arm.castShadow=true;g.add(arm);return g}
const pMesh=makeChar(false);scene.add(pMesh);
const enemies=[];for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,r=20+Math.random()*45;const g=makeChar(true);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData.hp=60;g.userData.flash=0;scene.add(g);enemies.push(g)}
const weapons=[{name:'RIFLE DE ASALTO',mag:30,reserve:150,damage:20,rate:.12,spread:.018},{name:'ESCOPETA',mag:8,reserve:32,damage:12,rate:.8,spread:.08},{name:'PISTOLA',mag:12,reserve:72,damage:16,rate:.28,spread:.025}];let mag=30,reserve=150,weapon=0,lastShot=0;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLower]=true;if(e.key==='r')reload();if(e.key==='1')switchWeapon(0);if(e.key==='2')switchWeapon(1);if(e.key==='3')switchWeapon(2)});addEventListener('keyup',e=>keys[e.key.toLower]=false);
let yaw=0,pitch=-.18,started=false;document.getElementById('play').onclick=()=>{document.getElementById('start').classList.add('hidden');started=true;renderer.domElement.requestPointerLock?.()};document.getElementById('again').onclick=()=>location.reload();
addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement||started&&innerWidth>800){yaw-=e.movementX*.0022;pitch=Math.max(-.45,Math.min(.35,pitch-e.movementY*.0018))}});
function switchWeapon(i){weapon=i;mag=weapons[i].mag;reserve=weapons[i].reserve;document.querySelectorAll('.slot').forEach((s,j)=>s.classList.toggle('active',j===i));document.getElementById('weaponName').textContent=weapons[i].name;updateAmmo()}function reload(){if(player.reload||mag===weapons[weapon].mag)return;player.reload=1.5;notice('RECARGANDO');}function updateAmmo(){document.getElementById('mag').textContent=mag;document.getElementById('reserve').textContent=reserve}
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.style.opacity=1;clearTimeout(n.t);n.t=setTimeout(()=>n.style.opacity=0,900)}
let firing=false;addEventListener('mousedown',()=>firing=true);addEventListener('mouseup',()=>firing=false);addEventListener('touchstart',e=>{if(e.target.id==='touchFire')firing=true},{passive:true});addEventListener('touchend',()=>firing=false);
function shoot(t){if(!started||t-lastShot<weapons[weapon].rate*1000||player.reload)return;if(mag<=0){reload();return}lastShot=t;mag--;updateAmmo();const w=weapons[weapon];const dir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).normalize();let hits=[];for(const e of enemies){if(!e.visible)continue;const to=e.position.clone().add(new THREE.Vector3(0,1.2,0)).sub(camera.position).normalize();if(dir.dot(to)>Math.cos(.12+w.spread)){hits.push({e,d:e.position.distanceTo(camera.position)})}}hits.sort((a,b)=>a.d-b.d);if(hits.length){for(let i=0;i<(weapon===1?3:1)&&i<hits.length;i++){const e=hits[i].e;e.userData.hp-=w.damage*(weapon===1?(1-i*.25):1);e.children.forEach(c=>c.material?.emissive?.setHex(0xff0000));setTimeout(()=>e.children.forEach(c=>c.material?.emissive?.setHex(0x000000)),70);if(e.userData.hp<=0){e.visible=false;player.kills++;document.getElementById('killsNum').textContent=player.kills;if(enemies.every(x=>!x.visible))end(true)}}}flash();}
function flash(){const l=new THREE.PointLight(0xffaa22,3,8);l.position.copy(pMesh.position).add(new THREE.Vector3(0,1.5,0));scene.add(l);setTimeout(()=>scene.remove(l),45)}
const clock=new THREE.Clock();let alive=20,stormTime=45,stormRadius=88,gameOver=false;
function end(win){if(gameOver)return;gameOver=true;document.exitPointerLock?.();document.getElementById('overTitle').textContent=win?'VICTORIA':'ELIMINADO';document.getElementById('overText').textContent=`Eliminaciones: ${player.kills}`;document.getElementById('over').classList.remove('hidden')}
function updateMap(){const c=document.getElementById('map'),ctx=c.getContext('2d');ctx.clearRect(0,0,170,170);ctx.fillStyle='#74a85b';ctx.fillRect(0,0,170,170);ctx.strokeStyle='#77aadd';ctx.lineWidth=3;ctx.beginPath();ctx.arc(85,85,88-player.pos.length()*.4,0,7);ctx.stroke();ctx.fillStyle='#ff5d57';for(const e of enemies)if(e.visible){ctx.beginPath();ctx.arc(85+e.position.x*.9,85+e.position.z*.9,3,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(85,77);ctx.lineTo(79,92);ctx.lineTo(91,92);ctx.closePath();ctx.fill()}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=performance.now();if(started&&!gameOver){const forward=(keys['w']?1:0)-(keys['s']?1:0),side=(keys['d']?1:0)-(keys['a']?1:0);const speed=keys['shift']?10:7;const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const move=f.multiplyScalar(forward*speed*dt).add(r.multiplyScalar(side*speed*dt));if(player.pos.length()<82)player.pos.add(move);if(player.pos.length()>82)player.pos.setLength(82);player.pos.y=0;pMesh.position.copy(player.pos);pMesh.rotation.y=yaw+Math.PI;if(firing)shoot(t);if(player.reload){player.reload-=dt;if(player.reload<=0){const w=weapons[weapon],need=w.mag-mag,add=Math.min(need,w.reserve);mag+=add;reserve-=add;w.reserve=reserve;updateAmmo;updateAmmo()}}stormTime-=dt;if(stormTime<=0){stormTime=45;stormRadius-=5;notice('TORNADO SE CIERRA')}if(player.pos.length()>stormRadius){player.health-=5*dt;document.getElementById('hpBar').style.width=player.health+'%'}
for(const e of enemies){if(!e.visible)continue;const dist=e.position.distanceTo(player.pos);if(dist<42){const d=player.pos.clone().sub(e.position).setY(0).normalize();e.position.add(d.multiplyScalar(dt*(dist<8?0:2.2)));e.lookAt(player.pos.x,1,player.pos.z);if(dist<3&&Math.random()<dt*.9){if(player.shield>0){player.shield-=10;document.getElementById('shieldBar').style.width=player.shield+'%'}else{player.health-=10;document.getElementById('hpBar').style.width=player.health+'%';const dm=document.getElementById('damage');dm.style.opacity=.7;setTimeout(()=>dm.style.opacity=0,100)}if(player.health<=0)end(false)}}}}
const camTarget=player.pos.clone().add(new THREE.Vector3(0,2.1,0));const back=new THREE.Vector3(Math.sin(yaw)*5,3.5,Math.cos(yaw)*5);camera.position.copy(player.pos).add(back);camera.lookAt(player.pos.x,1.55,player.pos.z);alive=1+enemies.filter(e=>e.visible).length;document.getElementById('aliveNum').textContent=alive;document.getElementById('storm').textContent='ZONA '+String(Math.max(0,Math.ceil(stormTime))).padStart(2,'0')+':00';updateMap();renderer.render(scene,camera)}animate();
// touch joystick
const stick=document.getElementById('stick'),dot=document.getElementById('stickDot');let touchId=null;stick.addEventListener('touchstart',e=>{touchId=e.changedTouches[0].identifier},{passive:true});stick.addEventListener('touchmove',e=>{for(const q of e.changedTouches)if(q.identifier===touchId){const r=stick.getBoundingClientRect(),x=q.clientX-(r.left+r.width/2),y=q.clientY-(r.top+r.height/2);const l=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);dot.style.transform=`translate(${Math.cos(a)*l}px,${Math.sin(a)*l}px)`;keys['w']=y<-10;keys['s']=y>10;keys['a']=x<-10;keys['d']=x>10}},{passive:true});stick.addEventListener('touchend',()=>{dot.style.transform='';keys.w=keys.s=keys.a=keys.d=false});
</script>
</body></html>
